<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/x-icon" href="ordyan/images/internet.ico">
    <title>Catalyst's ProjectS</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background: url('img/background.jpg') no-repeat center center fixed;
            background-size: cover;
            color: gray;
            font-family: Arial, sans-serif;
            text-align: center;
        }
        .container {
            max-width: 600px;
            background: rgba(0, 0, 0, 0.7);
            padding: 20px;
            border-radius: 10px;
        }
        h1 {
            font-size: 32px;
            margin-bottom: 20px;
        }
        p {
            font-size: 13px;
            margin-top: 20px;
        }
        a {
            display: inline-block;
            margin-top: 12px;
            padding: 10px 20px;
            background-color: #242f51;
            color: white;
            text-decoration: none;
            font-weight: bold;
            border-radius: 5px;
            transition: background-color 0.3s, transform 0.3s;
        }
        a:hover {
            background-color: gray;
            transform: scale(1.05);
        }
        button {
            padding: 12px 24px;
            font-size: 16px;
            color: #fff;
            background-color: #242f51;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            margin: 10px;
            transition: background-color 0.3s, transform 0.3s;
        }
        button:hover {
            background-color: #0056b3;
            transform: scale(1.05);
        }
        #myAudio {
            display: none;
        }
        #warningModal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.8);
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }
        .modal-content {
            background: white;
            padding: 20px;
            border-radius: 10px;
            text-align: center;
            max-width: 400px;
            width: 90%;
        }
        .modal-buttons {
            margin-top: 20px;
        }
        .modal-buttons button {
            margin: 0 10px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>All Projects</h1>
        <button id="downloadBtn">Download Launcher (Alpha, unstable)</button>
        <a href="https://ordyansoft.github.io/ordyan/davit.html" target="_blank">NGINX SERVER</a>
    </div>
    <div id="warningModal">
        <div class="modal-content">
            <p>This is an unstable alpha version. Are you sure you want to proceed?</p>
            <div class="modal-buttons">
                <button id="proceedBtn">Yes, Proceed</button>
                <button id="cancelBtn">Cancel</button>
            </div>
        </div>
    </div>
    <script>
        const downloadBtn = document.getElementById('downloadBtn');
        const warningModal = document.getElementById('warningModal');
        const proceedBtn = document.getElementById('proceedBtn');
        const cancelBtn = document.getElementById('cancelBtn');

        downloadBtn.addEventListener('click', () => {
            warningModal.style.display = 'flex';
        });

        proceedBtn.addEventListener('click', () => {
            warningModal.style.display = 'none';
            window.location.href = 'https://ordyansoft.github.io/setup.bat';
        });

        cancelBtn.addEventListener('click', () => {
            warningModal.style.display = 'none';
        });
    </script>
    <footer>
        <p>Created in ARMENIA, <a href="https://t.me/r34_43yz0l" target="_blank">https://t.me/r34_43yz0l</a></p>
    </footer>
</body>
</html>
